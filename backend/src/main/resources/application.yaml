spring:
  application:
    name: kk-fire-services-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/kk-fire-services
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
